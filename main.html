<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القرآن الكريم</title>

  <!-- روابط للخطوط من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=El+Messiri&display=swap" rel="stylesheet">

  <!-- رابط لـ Bootstrap لإضافة التنسيق -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* تنسيق الجسم العام للصفحة */
    body {
      font-family: 'Amiri', serif;
      margin: 0;
      padding: 0;
      direction: rtl;
      /* الاتجاه من اليمين لليسار */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-image: url(back2.png);
      background-size: cover;
      background-repeat: no-repeat;
      user-select: none;
    }

    /* تنسيق الهيدر */
    header {
      color: #f9f4f4;
      padding: 20px;
      text-align: center;
      position: fixed;
      /* تثبيت الهيدر في أعلى الصفحة */
      top: 0;
      width: 100%;
      z-index: 100;
      /* لضمان ظهور الهيدر فوق العناصر الأخرى */
    }

    header h1 {
      margin: 0;
      font-family: 'El Messiri', sans-serif;
      font-size: 2.5em;
    }

    /* تنسيق شريط التنقل */
    nav ul {
      list-style: none;
      /* إزالة النقاط من القائمة */
      padding: 0;
      margin: 10px 0 0;
      display: flex;
      justify-content: center;
    }

    nav li {
      margin: 0 10px;
    }

    nav a {
      color: #f6f4f4;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
      /* تأثير انتقال سلس عند تغيير اللون */
    }

    nav a:hover {
      color: #ffc107;
      /* تغيير اللون عند التحويم */
    }

    /* تنسيق القسم الرئيسي */
    main {
      padding: 30px;
      padding-top: 100px;
      /* إضافة مساحة فوق القسم الرئيسي لتفادي تغطية الهيدر */
    }

    /* تنسيق الحاوية للصورة */
    .container {
      margin: 50px auto;
      width: 80%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      /* السماح بتغليف العناصر في الحاوية */
      gap: 10px;
      /* المسافة بين العناصر */
    }

    .container img {
      width: 200px;
      height: 300px;
      object-fit: cover;
      /* تغطية الصورة ضمن الحدود */
      border-radius: 10px;
      /* حواف دائرية للصورة */-
      border: 2px solid rgba(204, 198, 167, 0.639);
      transition: all 0.3s ease;
      /* تأثير انتقال سلس لجميع الخصائص */
    }

    .container img:hover {
      transform: scale(1.1);
      /* تكبير الصورة عند التحويم */
      border-color: #ffc107;
      /* تغيير لون الحدود عند التحويم */
    }

    /* تنسيق الفوتر */
    footer {
      color: #f9f6f6;
      padding: 10px;
      text-align: center;
      margin-top: auto;
      /* دفع الفوتر إلى أسفل الصفحة */
    }

    /* تنسيق صندوق البحث */
    .search-box {
      padding: 20px;
      margin: 20px auto;
      width: 50%;
      text-align: center;
    }
  </style>
</head>

<body>

      </ul>
    </nav>
  </header>

  <main>

      <input type="text" class="form-control" placeholder="ابحث عن آية أو سورة...">
    </div>
